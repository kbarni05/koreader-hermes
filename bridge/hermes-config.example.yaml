# Merge this entry into ~/.hermes/config.yaml ON THE NAS.
# Preserve any existing mcp_servers entries.
mcp_servers:
  kobo:
    command: python3
    args: ["/absolute/path/to/koreader-hermes/bridge/hermes_kobo_mcp.py"]
    env:
      KOBO_URL: "auto"
      # Pair first with --pair under the same OS user. Set an explicit shared
      # profile path here when Hermes runs in Docker or under another service.
      # HERMES_CONNECTION_FILE: "/var/lib/hermes-kobo/connection.json"
      # Legacy/manual mode: use a Kobo URL instead of auto and set KOBO_TOKEN.
      # Optional: process update requests from the Kobo menu while Hermes runs.
      HERMES_DEVICE_UPDATE_REQUESTS: "1"
    timeout: 600
